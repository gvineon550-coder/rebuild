name: IPTV Check
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      test_url:
        description: "Проверить один URL"
        required: false
      deep:
        description: "DEEP режим"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: iptv-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: data
          key: iptv-data-${{ github.run_id }}
          restore-keys: iptv-data-
      - run: pip install -r requirements.txt
      - name: Run checker
        env:
          IPTV_CONC: "250"
          TEST_URL: ${{ github.event.inputs.test_url }}
          DEEP_CHECK: ${{ github.event.inputs.deep == 'true' && '1' || '0' }}
        run: python -m scripts.run_all
      - name: Commit
        if: success()
        run: |
          git config user.name "iptv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: refresh $(date -u +%F_%H:%M)"
          git push
