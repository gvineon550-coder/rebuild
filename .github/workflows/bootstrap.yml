name: Bootstrap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python bootstrap_1.py
      - run: python bootstrap_2.py
      - run: |
          git config user.name "iptv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "bootstrap: unpack ultimate"
          git push
